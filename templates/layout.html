<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Agent Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">
    <nav class="bg-gray-900 text-white p-4 shadow">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <a href="{{ url_for('dashboard') }}" class="text-xl font-bold">Apply-Agent UI</a>
            <div class="space-x-4">
                <a href="{{ url_for('dashboard') }}" class="hover:text-gray-300">Dashboard</a>
                <a href="{{ url_for('tailor_route') }}" class="hover:text-gray-300">Tailor Resume</a>
                <a href="{{ url_for('emails') }}" class="hover:text-gray-300">Emails</a>
                <a href="{{ url_for('form_fill_route') }}" class="hover:text-gray-300">Form Fill</a>
                <a href="{{ url_for('profile_setup') }}" class="hover:text-gray-300">Profile</a>
            </div>
        </div>
    </nav>
    <main class="max-w-7xl mx-auto p-6 mt-4">
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="mb-6 p-4 rounded shadow font-semibold {% if category == 'error' %}bg-red-100 text-red-800 border-l-4 border-red-600{% else %}bg-green-100 text-green-800 border-l-4 border-green-600{% endif %}">
                  {{ message }}
              </div>
            {% endfor %}
          {% endif %}
        {% endwith %}
        
        {% block content %}{% endblock %}
    </main>
</body>
</html>
