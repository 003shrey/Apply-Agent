{% extends "layout.html" %}
{% block content %}
<div class="max-w-3xl mx-auto bg-white p-8 rounded shadow">
    <h1 class="text-2xl font-bold mb-6">Review Generated Profile</h1>
    <div class="mb-8">
        <pre class="bg-gray-100 p-4 rounded text-sm overflow-x-auto text-gray-700">{{ profile | tojson(indent=2) }}</pre>
    </div>
    
    <form method="POST" action="{{ url_for('profile_review') }}">
        <button type="submit" class="bg-green-600 text-white px-6 py-2 rounded font-bold">Approve & Save to Disk</button>
        <a href="{{ url_for('profile_setup') }}" class="ml-4 text-red-600 font-semibold hover:underline">Discard</a>
    </form>
</div>
{% endblock %}
